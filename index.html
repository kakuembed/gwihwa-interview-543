<style>
  :root {
    --bg: #FFF3F7;
    --surface: #FFFFFF;
    --surface-2: #FCE8F0;
    --surface-3: #F8D3E3;
    --ink: #3A2530;
    --ink-soft: #8C6577;
    --ink-faint: #C296AC;
    --accent-blue: #E8598C;
    --accent-blue-strong: #C13D6B;
    --accent-blue-tint: #FCE2EC;
    --accent-red: #B83A63;
    --accent-red-strong: #94284A;
    --accent-red-tint: #FBDCE7;
    --accent-gold: #B4842A;
    --accent-gold-tint: #F5E7C7;
    --border: #F6CADE;
    --shadow-1: rgba(184, 58, 99, 0.10);
    --shadow-2: rgba(184, 58, 99, 0.22);
    --focus-ring: #E8598C;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C0F17;
      --surface: #2A1721;
      --surface-2: #3A1F2D;
      --surface-3: #4A2839;
      --ink: #F8E8EF;
      --ink-soft: #D9AEC2;
      --ink-faint: #90687C;
      --accent-blue: #FF8FBC;
      --accent-blue-strong: #FFB6D5;
      --accent-blue-tint: #3D2130;
      --accent-red: #F2799D;
      --accent-red-strong: #FBAFC7;
      --accent-red-tint: #3D1F29;
      --accent-gold: #E5C067;
      --accent-gold-tint: #4A3B1C;
      --border: #4A2839;
      --shadow-1: rgba(0, 0, 0, 0.35);
      --shadow-2: rgba(0, 0, 0, 0.55);
      --focus-ring: #FF8FBC;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1C0F17;
    --surface: #2A1721;
    --surface-2: #3A1F2D;
    --surface-3: #4A2839;
    --ink: #F8E8EF;
    --ink-soft: #D9AEC2;
    --ink-faint: #90687C;
    --accent-blue: #FF8FBC;
    --accent-blue-strong: #FFB6D5;
    --accent-blue-tint: #3D2130;
    --accent-red: #F2799D;
    --accent-red-strong: #FBAFC7;
    --accent-red-tint: #3D1F29;
    --accent-gold: #E5C067;
    --accent-gold-tint: #4A3B1C;
    --border: #4A2839;
    --shadow-1: rgba(0, 0, 0, 0.35);
    --shadow-2: rgba(0, 0, 0, 0.55);
    --focus-ring: #FF8FBC;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  h1, h2, h3 { font-family: "Noto Serif KR", serif; text-wrap: balance; margin: 0; }

  button { font-family: inherit; }

  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
  }

  /* ---------- top bar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .brand-mark {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--accent-blue);
  }

  .brand-title {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    white-space: nowrap;
  }

  .progress-pill {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
  }

  .toc-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px 8px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  /* ---------- section strip ---------- */

  .section-strip {
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    padding: 0 18px 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .section-strip .label {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }

  .section-strip .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-blue-strong);
  }

  .bar-track {
    height: 5px;
    border-radius: 999px;
    background: var(--surface-3);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-red));
    transition: width 0.25s ease;
  }

  /* ---------- card stage ---------- */

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px 4px;
    perspective: 1600px;
  }

  .card-wrap {
    width: 100%;
    max-width: 460px;
  }

  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 62vh;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.2, .8, .3, 1);
  }

  .card.flipped { transform: rotateY(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 22px;
    padding: 26px 24px 22px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 30px var(--shadow-1), 0 2px 8px var(--shadow-1);
    border: 1px solid var(--border);
  }

  .face-front {
    background: var(--surface);
  }

  .face-back {
    background: var(--surface);
    transform: rotateY(180deg);
    border-color: var(--accent-red-tint);
  }

  @media (prefers-reduced-motion: reduce) {
    .face-back { visibility: hidden; }
    .card.flipped .face-back { visibility: visible; }
    .card.flipped .face-front { visibility: hidden; }
  }

  .face-eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .num-badge {
    font-family: "Noto Serif KR", serif;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    background: var(--accent-blue);
    border-radius: 10px;
    padding: 5px 12px;
    font-variant-numeric: tabular-nums;
  }

  .face-back .num-badge { background: var(--accent-red); }

  .face-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .face-body {
    flex: 1;
    display: flex;
    align-items: center;
    overflow-y: auto;
  }

  .q-text {
    font-family: "Noto Serif KR", serif;
    font-weight: 600;
    font-size: clamp(19px, 4.6vw, 24px);
    line-height: 1.5;
    color: var(--ink);
  }

  .a-text {
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 5vw, 26px);
    line-height: 1.5;
    color: var(--accent-red-strong);
  }

  .guess-flag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-gold);
    background: var(--accent-gold-tint);
    border-radius: 8px;
    padding: 4px 8px;
    margin-top: 12px;
  }

  .face-hint {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 10px;
  }

  /* ---------- nav bar ---------- */

  .navbar {
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
  }

  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 16px;
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .nav-btn.primary {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: #fff;
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ---------- TOC sheet ---------- */

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 26, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 20;
  }

  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 560px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -12px 40px var(--shadow-2);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.2, .8, .3, 1);
    z-index: 21;
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 999px;
    background: var(--surface-3);
    margin: 10px auto 4px;
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 14px;
    border-bottom: 1px solid var(--border);
  }

  .sheet-head h2 { font-size: 19px; }

  .sheet-close {
    background: var(--surface-2);
    border: none;
    color: var(--ink-soft);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }

  .jump-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
  }

  .jump-row input {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }

  .jump-row button {
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .sheet-list {
    overflow-y: auto;
    padding: 4px 14px 20px;
  }

  .sec-block {
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--surface);
  }

  .sec-head {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
  }

  .sec-range {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-blue);
    background: var(--accent-blue-tint);
    border-radius: 8px;
    padding: 4px 8px;
    flex-shrink: 0;
  }

  .sec-titles { flex: 1; min-width: 0; }
  .sec-title { font-size: 14.5px; font-weight: 600; }
  .sec-sub { font-size: 12px; color: var(--ink-faint); margin-top: 1px; }

  .sec-progress {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-faint);
    flex-shrink: 0;
  }

  .sec-chevron {
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--ink-faint);
  }

  .sec-block.expanded .sec-chevron { transform: rotate(180deg); }

  .sec-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
    gap: 6px;
    padding: 4px 14px 14px;
  }

  .sec-block.expanded .sec-grid { display: grid; }

  .num-chip {
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 0;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink-soft);
    cursor: pointer;
    text-align: center;
  }

  .num-chip.done { background: var(--accent-blue-tint); color: var(--accent-blue-strong); border-color: transparent; }
  .num-chip.current { background: var(--accent-red); color: #fff; border-color: transparent; }

  [hidden] { display: none !important; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap;
  }
</style>

<div class="topbar">

      <g transform="translate(12 12)">

      </g>
      <circle cx="12" cy="12" r="2.4" fill="var(--accent-gold)"/>

    <span class="brand-title">귀화면접 543</span>

  </button>

<div class="section-strip">
  <div class="bar-track"><div class="bar-fill" id="secBarFill"></div></div>

<div class="stage">

      </div>
      <div class="face face-back">

          <span class="num-badge" id="numBadgeBack">1</span>

          <div>

        <div class="face-hint" id="backHint">탭하여 다음 문제로</div>
      </div>
    </div>
  </div>
</div>

<div class="navbar">
  <button class="nav-btn" id="prevBtn" aria-label="이전 문항">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    이전
  </button>
  <button class="nav-btn primary" id="nextBtn" aria-label="다음 문항">
    다음
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="tocSheet" role="dialog" aria-modal="true" aria-label="목차">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2>목차</h2>
    <button class="sheet-close" id="tocCloseBtn" aria-label="닫기">✕</button>
  </div>
  <div class="jump-row">
    <input id="jumpInput" type="number" inputmode="numeric" min="1" max="547" placeholder="번호로 이동 (1~547)">
    <button id="jumpBtn">이동</button>
  </div>
  <div class="sheet-list" id="sectionList"></div>

<script>
(function () {

  var state = { index: 0, flipped: false, openSection: null };

  };

  function sectionOf(num) {
    for (var i = 0; i < SECTIONS.length; i++) {
      if (num >= SECTIONS[i].lo && num <= SECTIONS[i].hi) return SECTIONS[i];
    }
    return SECTIONS[0];
  }

  function clampIndex(i) {
    return Math.max(0, Math.min(TOTAL - 1, i));
  }

  function render() {
    var card = QA_DATA[state.index];

    var sec = sectionOf(card.n);
    els.secName.textContent = sec.title;
    els.secRangeLabel.textContent = sec.lo + "~" + sec.hi + "번";
    var secSpanCount = QA_DATA.filter(function (c) { return c.n >= sec.lo && c.n <= sec.hi; }).length;
    var secDoneCount = QA_DATA.filter(function (c) { return c.n >= sec.lo && c.n <= sec.hi && c._i <= state.index; }).length;
    els.secBarFill.style.width = (secSpanCount ? (secDoneCount / secSpanCount * 100) : 0) + "%";

    els.prevBtn.disabled = state.index === 0;
    els.nextBtn.textContent = "";

    persist();

  function goTo(index, flipped) {
    state.index = clampIndex(index);

  function flip() {
    state.flipped = !state.flipped;
    els.card.classList.toggle("flipped", state.flipped);
  }

  function handleTap() {
    if (!state.flipped) {
      flip();
    } else if (state.index < TOTAL - 1) {
      goTo(state.index + 1, false);
    }
  }

  els.card.addEventListener("click", handleTap);
  els.card.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleTap(); }
  });

  els.prevBtn.addEventListener("click", function () { goTo(state.index - 1, false); });
  els.nextBtn.addEventListener("click", function () { goTo(state.index + 1, false); });

  document.addEventListener("keydown", function (e) {
    if (els.sheet.classList.contains("open")) return;
    if (e.key === "ArrowRight") goTo(state.index + 1, false);
    if (e.key === "ArrowLeft") goTo(state.index - 1, false);
  });

  /* swipe */
  var touchStartX = null, touchStartY = null;
  els.card.addEventListener("touchstart", function (e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  els.card.addEventListener("touchend", function (e) {
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) goTo(state.index + 1, false); else goTo(state.index - 1, false);
    }
    touchStartX = null; touchStartY = null;
  }, { passive: true });

  /* ---------- TOC sheet ---------- */

  function buildSectionList() {
    els.sectionList.innerHTML = "";
    SECTIONS.forEach(function (sec, si) {
      var cards = QA_DATA.filter(function (c) { return c.n >= sec.lo && c.n <= sec.hi; });
      var block = document.createElement("div");
      block.className = "sec-block";
      block.dataset.si = si;

      var doneCount = cards.filter(function (c) { return c._i <= state.index; }).length;

      var head = document.createElement("button");
      head.className = "sec-head";
      head.innerHTML =
        '<span class="sec-range">' + sec.lo + '~' + sec.hi + '</span>' +
        '<span class="sec-titles"><span class="sec-title">' + sec.title + '</span>' +
        '<div class="sec-sub">' + sec.sub + '</div></span>' +
        '<span class="sec-progress">' + doneCount + '/' + cards.length + '</span>' +
        '<svg class="sec-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
      head.addEventListener("click", function () {
        var wasExpanded = block.classList.contains("expanded");
        document.querySelectorAll(".sec-block.expanded").forEach(function (b) { b.classList.remove("expanded"); });
        if (!wasExpanded) block.classList.add("expanded");
      });

      var grid = document.createElement("div");
      grid.className = "sec-grid";
      cards.forEach(function (c) {
        var chip = document.createElement("button");
        chip.className = "num-chip";
        if (c._i < state.index) chip.classList.add("done");
        if (c._i === state.index) chip.classList.add("current");
        chip.textContent = c.n;
        chip.addEventListener("click", function () {
          goTo(c._i, false);
          closeSheet();
        });
        grid.appendChild(chip);
      });

      block.appendChild(head);
      block.appendChild(grid);
      els.sectionList.appendChild(block);
    });

    var currentSec = sectionOf(QA_DATA[state.index].n);
    var idx = SECTIONS.indexOf(currentSec);
    var currentBlock = els.sectionList.querySelector('[data-si="' + idx + '"]');
    if (currentBlock) {
      currentBlock.classList.add("expanded");
      requestAnimationFrame(function () {
        currentBlock.scrollIntoView({ block: "center" });
      });
    }
  }

  function openSheet() {
    buildSectionList();
    els.backdrop.classList.add("open");
    els.sheet.classList.add("open");
    els.jumpInput.value = "";
  }
  function closeSheet() {
    els.backdrop.classList.remove("open");
    els.sheet.classList.remove("open");
  }

  els.tocOpenBtn.addEventListener("click", openSheet);
  els.tocCloseBtn.addEventListener("click", closeSheet);
  els.backdrop.addEventListener("click", closeSheet);

  function jumpToNumber(n) {
    n = Math.max(1, Math.min(547, Math.round(n)));
    var best = null;
    for (var i = 0; i < QA_DATA.length; i++) {
      if (QA_DATA[i].n >= n) { best = QA_DATA[i]; break; }
    }
    if (!best) best = QA_DATA[QA_DATA.length - 1];
    goTo(best._i, false);
    closeSheet();
  }

  els.jumpBtn.addEventListener("click", function () {
    var v = parseInt(els.jumpInput.value, 10);
    if (!isNaN(v)) jumpToNumber(v);
  });
  els.jumpInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") els.jumpBtn.click();
  });

  /* ---------- persistence (local only, per device) ---------- */

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ index: state.index, n: QA_DATA[state.index].n }));
    } catch (e) { /* private mode / quota: ignore, session state still works */ }
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed.n === "number" && byN[parsed.n]) return byN[parsed.n]._i;
    } catch (e) {}
    return null;
  }

  function boot(hotData) {
    var startIndex = 0;
    if (hotData && typeof hotData.index === "number") {
      startIndex = clampIndex(hotData.index);
    } else {
      var local = loadLocal();
      if (local !== null) startIndex = local;
    }
    goTo(startIndex, false);
  }

  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { index: state.index }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
})();
</script>
